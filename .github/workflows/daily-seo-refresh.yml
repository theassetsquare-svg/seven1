name: Daily SEO Refresh (24h Auto)

on:
  schedule:
    # 매일 00:05 KST = 15:05 UTC (전날) — Cloudflare Pages 자동 빌드 트리거
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-seo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute dates (KST)
        id: dates
        run: |
          export TZ=Asia/Seoul
          echo "iso=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "rfc=$(date -R)" >> "$GITHUB_OUTPUT"

      - name: Update sitemap.xml lastmod
        run: |
          sed -i -E "s#<lastmod>[0-9]{4}-[0-9]{2}-[0-9]{2}</lastmod>#<lastmod>${{ steps.dates.outputs.iso }}</lastmod>#g" sitemap.xml

      - name: Update rss.xml pubDate / lastBuildDate
        run: |
          # RFC 822 형식: "Tue, 26 May 2026 00:00:00 +0900"
          RFC="${{ steps.dates.outputs.rfc }}"
          # date -R 결과를 그대로 RSS에 박음
          sed -i -E "s#<pubDate>[^<]+</pubDate>#<pubDate>${RFC}</pubDate>#g" rss.xml
          sed -i -E "s#<lastBuildDate>[^<]+</lastBuildDate>#<lastBuildDate>${RFC}</lastBuildDate>#g" rss.xml

      - name: Update index.html last-modified meta + JSON-LD dateModified
        run: |
          ISO="${{ steps.dates.outputs.iso }}"
          sed -i -E "s#<meta name=\"last-modified\" content=\"[0-9]{4}-[0-9]{2}-[0-9]{2}\" />#<meta name=\"last-modified\" content=\"${ISO}\" />#g" index.html
          # JSON-LD 안의 dateModified — 모든 발생 위치 갱신
          sed -i -E "s#\"dateModified\": \"[0-9]{4}-[0-9]{2}-[0-9]{2}\"#\"dateModified\": \"${ISO}\"#g" index.html

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml rss.xml index.html
          if git diff --staged --quiet; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
            echo "변경 없음 — 푸시 스킵"
          else
            git commit -m "chore: 일일 SEO 신선도 갱신 — ${{ steps.dates.outputs.iso }} [자동]"
            git push
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping IndexNow (Bing + Yandex + Naver 간접)
        if: steps.commit.outputs.no_changes == 'false'
        run: |
          KEY="83d34f87945b3ee6beb382d9c7b1d2f9"
          HOST="seven1-2jn.pages.dev"
          URL="https://${HOST}/"
          KEY_LOC="https://${HOST}/${KEY}.txt"
          # api.indexnow.org가 자동으로 Bing/Yandex/Seznam 등에 전파
          for endpoint in "https://api.indexnow.org/indexnow" "https://www.bing.com/indexnow" "https://yandex.com/indexnow"; do
            echo "→ ${endpoint}"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST "${endpoint}" \
              -H "Content-Type: application/json" \
              -d "{\"host\":\"${HOST}\",\"key\":\"${KEY}\",\"keyLocation\":\"${KEY_LOC}\",\"urlList\":[\"${URL}\"]}" || true
          done

      - name: Ping Google sitemap
        if: steps.commit.outputs.no_changes == 'false'
        run: |
          # Google deprecated 했지만 일부 보조 시그널로 유지
          curl -s -o /dev/null -w "Google %{http_code}\n" \
            "https://www.google.com/ping?sitemap=https://seven1-2jn.pages.dev/sitemap.xml" || true

      - name: Summary
        run: |
          echo "## 일일 SEO 자동 갱신" >> "$GITHUB_STEP_SUMMARY"
          echo "- 날짜: ${{ steps.dates.outputs.iso }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- 변경 푸시: ${{ steps.commit.outputs.no_changes == 'false' && '✅' || '⏭ 변경 없음' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- IndexNow 핑 발사: ${{ steps.commit.outputs.no_changes == 'false' && '✅' || '⏭' }}" >> "$GITHUB_STEP_SUMMARY"
