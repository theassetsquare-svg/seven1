<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1410"/>
      <stop offset="100%" stop-color="#050a08"/>
    </linearGradient>
    <linearGradient id="seven" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="26" fill="url(#glow)"/>

  <!-- Big stylized "7" -->
  <g transform="translate(32 33)">
    <text x="0" y="0"
          text-anchor="middle"
          dominant-baseline="central"
          font-family="Arial Black, sans-serif"
          font-weight="900"
          font-size="46"
          fill="url(#seven)"
          letter-spacing="-2">7</text>
  </g>

  <!-- bottom accent bar (emerald + cyan) -->
  <rect x="0" y="58" width="64" height="6" fill="#06b6d4"/>
  <rect x="0" y="58" width="32" height="6" fill="#34d399"/>
</svg>
